services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atendio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo
    restart: always
    env_file:
      - .env.docker
    ports:
      - 27018:27017
    volumes:
      - mongo_data:/var/lib/mongodb/data
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  mongo-express:
    image: mongo-express
    ports:
      - 8181:8081
    env_file:
      - .env.docker
    links:
      - "mongo"

  redis:
    image: redis:6
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/var/lib/redis/data

  app:
    build: .
    ports:
      - "5100:5000"
    depends_on:
      - mongo
      - redis
    env_file:
      - .env.docker
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/uploads
      APP_URL: http://localhost:5100
      ENABLE_BAILEYS_SOCKET: "false"
    volumes:
      - uploads:/app/uploads

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  uploads:
